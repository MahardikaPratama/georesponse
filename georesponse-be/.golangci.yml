# Author       : Mahardika Pratama
# Version      : 1.0.0
# Created Date : 2026-09-19
# Description  : golangci-lint configuration for georesponse-be. Configures
#                a reasonable default rule set consistent with
#                docs/05_engineering/CODING_STANDARDS.md section 14 (Go
#                Rules) and docs/07_backend/BACKEND_DEPENDENCIES.md.
#                Referenced by scripts/quality/check.sh.
#
# Changelog:
# - 1.0.0 (2026-09-19): Initial creation.

run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - govet
    - staticcheck
    - errcheck
    - unused
    - gosimple
    - ineffassign

issues:
  exclude-dirs:
    - vendor
