name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint, type-check, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: georesponse-fe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: georesponse-fe/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test

  backend:
    name: Backend (fmt, vet, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: georesponse-be
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: georesponse-be/go.sum
      - run: gofmt -l . | tee /tmp/fmt.out && test ! -s /tmp/fmt.out
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -cover

  integration:
    name: Integration (API + PostGIS)
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: georesponse
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: georesponse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U georesponse -d georesponse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://georesponse:ci-only-password@localhost:5432/georesponse?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: georesponse-be/go.sum
      - name: Start the backend (APP_ENV=development applies migrations at start-up)
        working-directory: georesponse-be
        env:
          APP_ENV: development
          HTTP_PORT: "8080"
          LOG_LEVEL: info
          TOKEN_SECRET: ci-only-token-secret
          MIGRATIONS_DIR: ../database/migrations
        run: |
          go build -o /tmp/georesponse-be ./cmd/api
          nohup /tmp/georesponse-be > /tmp/georesponse-be.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health | grep -q '"database":"ok"'; then
              echo "backend healthy"; exit 0
            fi
            sleep 1
          done
          echo "backend did not become healthy"; cat /tmp/georesponse-be.log; exit 1
      - name: Load seed data (demo accounts and sample resources)
        run: |
          for f in database/seeds/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Run tests/integration against the live backend
        working-directory: tests/integration
        env:
          GEORESPONSE_API_URL: http://localhost:8080
        run: go test ./... -count=1 -v
      - name: Backend log
        if: failure()
        run: cat /tmp/georesponse-be.log

  docker-build:
    name: Docker image build verification
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./georesponse-fe
          push: false
          tags: georesponse-fe:ci
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./georesponse-be
          push: false
          tags: georesponse-be:ci
