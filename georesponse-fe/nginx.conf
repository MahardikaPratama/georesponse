# georesponse-fe/nginx.conf
#
# Author       : Mahardika Pratama
# Version      : 1.0.0
# Created Date : 2026-09-20
# Description  : nginx server block for the frontend runtime image. Serves
#                the Rspack build output as a single-page application
#                (unknown paths fall back to index.html so client-side
#                routing works), caches content-hashed assets aggressively,
#                and keeps index.html uncached so a new deploy is picked up
#                immediately. The API is called directly by the browser at
#                API_BASE_URL; nothing is proxied here.
#
# Changelog:
# - 1.0.0 (2026-09-20): Initial creation.

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Content-hashed bundles (main.<hash>.js, *.css, fonts) can be cached
    # for a long time; a new build produces new file names.
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback: every other path serves index.html, never cached.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
