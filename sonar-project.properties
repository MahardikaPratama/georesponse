sonar.projectKey=georesponse
sonar.projectName=GeoResponse
sonar.projectVersion=1.0.0

# Source roots for both languages analyzed in a single project.
sonar.sources=georesponse-fe/src,georesponse-be

# Exclude generated output, vendored/installed dependencies, and non-source
# assets from analysis entirely.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/vendor/**,**/*.min.js,**/coverage/**,**/.git/**

# Test files are still analyzed for issues but excluded from being counted
# as "source" for duplication/coverage-of-production-code purposes.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*_test.go
sonar.tests=georesponse-fe/src,georesponse-be
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/vendor/**

# Coverage report ingestion, one property per language toolchain.
sonar.javascript.lcov.reportPaths=georesponse-fe/coverage/lcov.info
sonar.typescript.lcov.reportPaths=georesponse-fe/coverage/lcov.info
sonar.go.coverage.reportPaths=georesponse-be/coverage.out

# Encoding of source files scanned.
sonar.sourceEncoding=UTF-8
